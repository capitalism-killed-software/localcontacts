name: image

# The ready-made container image, ghcr.io/capitalism-killed-software/localcontacts.
# Every run builds it for Intel and ARM and checks that it starts and answers.
# Only a release tag (v1.2.3) publishes it, as 1.2.3, 1.2, 1 and latest; pushes to
# next that touch the image, and runs started by hand, publish nothing.
on:
  push:
    tags: ['v*.*.*']
    branches: [next]
    paths: [Dockerfile, .dockerignore, package-lock.json, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/capitalism-killed-software/localcontacts

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for this runner
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: localcontacts:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts, greets an empty book and refuses other sites
        run: |
          docker run -d --name check -p 127.0.0.1:3000:3000 localcontacts:check
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -fsS http://localhost:3000/ | grep -q 'Your address book is empty'
          curl -fsS http://localhost:3000/api/contacts | head -c 1 | grep -q '{'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Site: cross-site' http://localhost:3000/api/contacts)" = 403
          docker logs check
          docker rm -f check

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch

      - name: Log in to GitHub's registry
        if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Intel and ARM (and publish, for a release tag)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Record how it was built
        if: env.RELEASE == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
