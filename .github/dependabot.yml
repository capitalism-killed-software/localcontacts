# Weekly dependency updates, grouped into one pull request per ecosystem,
# so the audit stays clean after release. Security fixes still arrive as
# soon as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The app supports Node 22.13 and newer, so its Node types stay on the 22 line:
    # newer ones would let code use APIs that Node 22 doesn't have.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
