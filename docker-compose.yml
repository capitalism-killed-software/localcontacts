services:
  localcontacts:
    # The ready-made image, for Intel and ARM (a Raspberry Pi or a NAS too). `1`
    # follows every 1.x release; write a version instead (:1.1.0) to update only
    # when you choose. To build it yourself from this folder, replace the image
    # line with:  build: .
    image: ghcr.io/capitalism-killed-software/localcontacts:1
    container_name: localcontacts
    restart: unless-stopped
    # Bound to the host's loopback on purpose: reach it through a VPN, an SSH
    # tunnel or an authenticating proxy. See docs/DEPLOY.md.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./imports:/app/imports
    environment:
      - CONTACTS_DEFAULT_COUNTRY=US
      # Names other than localhost you reach it by (Tailscale IP, proxy hostname):
      # - CONTACTS_ALLOWED_HOSTS=100.64.1.2,contacts.example.com
      # Your time zone, so backup file names show your local time (otherwise UTC):
      # - TZ=America/Los_Angeles
